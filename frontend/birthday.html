    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        // =====================================
        // MOBILE MENU
        // =====================================

        const hamburger =
            document.querySelector(
                '.hamburger'
            );


        const navlink =
            document.querySelector(
                '.navlink'
            );


        hamburger.addEventListener(
            'click',
            () => {

                navlink.classList.toggle(
                    'active'
                );

            }
        );



        // =====================================
        // RENDER BACKEND
        // =====================================

        const API_URL =
            "https://jodysv.onrender.com";



        // =====================================
        // LOAD BIRTHDAY UPLOADS
        // =====================================

        async function loadBirthdayPictures() {

            try {

                console.log(
                    "Loading birthday pictures..."
                );


                const response =
                    await fetch(
                        `${API_URL}/api/images?category=birthday`
                    );


                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "Birthday pictures:",
                    data
                );


                if (
                    !data.images ||
                    data.images.length === 0
                ) {

                    return;

                }


                // =================================
                // ADD NEW UPLOADED PICTURES
                // =================================

                data.images.forEach(
                    filename => {


                        const galleryItem =
                            document.createElement(
                                "div"
                            );


                        galleryItem.className =
                            "gallery-item";


                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            `${API_URL}/uploads/birthday/${encodeURIComponent(filename)}`;


                        image.alt =
                            "Birthday Event";


                        image.loading =
                            "lazy";


                        image.onerror =
                            () => {

                                console.error(
                                    "Could not load:",
                                    image.src
                                );

                                galleryItem.remove();

                            };


                        galleryItem.appendChild(
                            image
                        );


                        document
                            .getElementById(
                                "birthdayGallery"
                            )
                            .appendChild(
                                galleryItem
                            );

                    }
                );


            } catch (error) {

                console.error(
                    "BIRTHDAY GALLERY ERROR:",
                    error
                );

            }

        }



        // =====================================
        // START
        // =====================================

        loadBirthdayPictures();


    </script>
