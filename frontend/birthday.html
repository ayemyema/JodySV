<script>


    // =========================
    // MOBILE MENU
    // =========================

    const hamburger =
        document.querySelector(
            ".hamburger"
        );

    const navlink =
        document.querySelector(
            ".navlink"
        );


    hamburger.addEventListener(
        "click",
        () => {

            navlink.classList.toggle(
                "active"
            );

        }
    );


    // =========================
    // RENDER BACKEND
    // =========================

    const API_URL =
        "https://jodysv.onrender.com";


    // =========================
    // LOAD BIRTHDAY UPLOADS
    // =========================

    async function loadUploadedBirthdayPictures() {

        const gallery =
            document.getElementById(
                "birthdayGallery"
            );


        try {

            const response =
                await fetch(
                    `${API_URL}/api/images?category=birthday`
                );


            if (!response.ok) {

                throw new Error(
                    `Server returned ${response.status}`
                );

            }


            const data =
                await response.json();


            console.log(
                "Uploaded birthday pictures:",
                data.images
            );


            if (
                !data.images ||
                data.images.length === 0
            ) {

                return;

            }


            // Add uploaded images

            data.images.forEach(
                filename => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "gallery-item";


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        `${API_URL}/uploads/birthday/${encodeURIComponent(filename)}`;


                    image.alt =
                        "New Birthday Event";


                    image.loading =
                        "lazy";


                    image.onerror =
                        () => {

                            console.error(
                                "Could not load image:",
                                image.src
                            );

                            item.remove();

                        };


                    item.appendChild(
                        image
                    );


                    gallery.appendChild(
                        item
                    );

                }
            );


        } catch (error) {

            console.error(
                "Could not load uploaded birthday pictures:",
                error
            );

        }

    }


    // Start loading
    loadUploadedBirthdayPictures();


</script>
