<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Jody SV Event Styling and Catering Services
    </title>

    <link
        rel="stylesheet"
        href="css/wedding.css"
    >

    <link
        rel="icon"
        href="images/logo/logopic.jpg"
        type="image/png"
    >

    <script
        src="https://kit.fontawesome.com/4b4ade4766.js"
        crossorigin="anonymous"
    ></script>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar">

        <div class="head">

            <h1>
                <a href="index.html">
                    Jody SV
                </a>
            </h1>

        </div>


        <div class="hamburger">
            &#9776;
        </div>


        <div class="navlink">

            <a href="index.html">
                Home
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="about.html">
                About
            </a>

        </div>

    </nav>



    <!-- =========================
         HEADER IMAGE
    ========================== -->

    <div class="bgpic">

        <img
            src="images/logo/logopic.jpg"
            alt="Jody SV Event Styling"
        >

    </div>



    <!-- =========================
         WEDDING GALLERY
    ========================== -->

    <div class="gallery-section">

        <h3>
            Wedding Events
        </h3>


        <!--
            Existing wedding pictures will
            also be loaded from the backend.

            The gallery starts empty and
            JavaScript fills it automatically.
        -->

        <div
            class="gallery"
            id="weddingGallery"
        >

            <p class="gallery-loading">
                Loading wedding pictures...
            </p>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        // =====================================
        // MOBILE NAVIGATION
        // =====================================

        const hamburger =
            document.querySelector(
                '.hamburger'
            );


        const navlink =
            document.querySelector(
                '.navlink'
            );


        hamburger.addEventListener(
            'click',
            () => {

                navlink.classList.toggle(
                    'active'
                );

            }
        );



        // =====================================
        // BACKEND URL
        // =====================================

        const API_URL =
            "https://jodysv.onrender.com";



        // =====================================
        // GALLERY
        // =====================================

        const gallery =
            document.getElementById(
                "weddingGallery"
            );



        // =====================================
        // LOAD WEDDING PICTURES
        // =====================================

        async function loadWeddingPictures() {

            try {

                console.log(
                    "Loading wedding pictures..."
                );


                const response =
                    await fetch(
                        `${API_URL}/api/images?category=wedding`
                    );


                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "Wedding pictures:",
                    data
                );


                // Clear loading message

                gallery.innerHTML = "";


                // =================================
                // NO PICTURES
                // =================================

                if (
                    !data.images ||
                    data.images.length === 0
                ) {

                    gallery.innerHTML = `
                        <p class="gallery-empty">
                            No wedding pictures uploaded yet.
                        </p>
                    `;

                    return;

                }



                // =================================
                // CREATE PICTURES
                // =================================

                data.images.forEach(
                    filename => {


                        const galleryItem =
                            document.createElement(
                                "div"
                            );


                        galleryItem.className =
                            "gallery-item";


                        const image =
                            document.createElement(
                                "img"
                            );


                        image.src =
                            `${API_URL}/uploads/wedding/${encodeURIComponent(filename)}`;


                        image.alt =
                            "Jody SV Wedding Event";


                        image.loading =
                            "lazy";


                        // If image fails to load

                        image.onerror =
                            () => {

                                console.error(
                                    "Could not load:",
                                    image.src
                                );

                                galleryItem.remove();

                            };


                        galleryItem.appendChild(
                            image
                        );


                        gallery.appendChild(
                            galleryItem
                        );

                    }
                );


            } catch (error) {


                console.error(
                    "WEDDING GALLERY ERROR:",
                    error
                );


                gallery.innerHTML = `
                    <p class="gallery-error">
                        Unable to load wedding pictures.
                        Please try again later.
                    </p>
                `;

            }

        }



        // =====================================
        // START
        // =====================================

        loadWeddingPictures();


    </script>


</body>

</html>
