        <!--
            NEW ADMIN-UPLOADED WEDDING
            PHOTOS WILL BE ADDED HERE
            AUTOMATICALLY
        -->

    </div>

</div>


<script>

    // =========================
    // MOBILE MENU
    // =========================

    const hamburger =
        document.querySelector(".hamburger");

    const navlink =
        document.querySelector(".navlink");

    hamburger.addEventListener(
        "click",
        () => {
            navlink.classList.toggle("active");
        }
    );


    // =========================
    // RENDER BACKEND
    // =========================

    const API_URL =
        "https://jodysv.onrender.com";


    // =========================
    // LOAD NEW WEDDING PHOTOS
    // =========================

    async function loadUploadedWeddingPictures() {

        const gallery =
            document.getElementById(
                "weddingGallery"
            );

        try {

            const response =
                await fetch(
                    `${API_URL}/api/images?category=wedding`
                );

            if (!response.ok) {
                throw new Error(
                    `Server returned ${response.status}`
                );
            }

            const data =
                await response.json();

            console.log(
                "Uploaded wedding pictures:",
                data.images
            );


            if (
                !data.images ||
                data.images.length === 0
            ) {
                return;
            }


            // Add each uploaded picture
            data.images.forEach(
                filename => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "gallery-item";


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        `${API_URL}/uploads/wedding/${encodeURIComponent(filename)}`;


                    image.alt =
                        "New Wedding Event";


                    image.loading =
                        "lazy";


                    image.onerror =
                        () => {

                            console.error(
                                "Could not load image:",
                                image.src
                            );

                            item.remove();

                        };


                    item.appendChild(
                        image
                    );

                    gallery.appendChild(
                        item
                    );

                }
            );

        } catch (error) {

            console.error(
                "Could not load uploaded wedding pictures:",
                error
            );

        }

    }


    // Load new pictures
    loadUploadedWeddingPictures();

</script>

</body>
